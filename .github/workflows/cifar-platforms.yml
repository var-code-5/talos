name: CIFAR peer platforms
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-peers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU runtime on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install CPU runtime on Apple Silicon
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.13.0
      - run: python -m pip install numpy==2.5.2 psutil==7.2.2
      - name: Prepare verified real data
        run: python -m mtcp.cifar prepare --download
      - name: Exercise model, platform metrics, discovery and symmetric training
        run: python -m unittest discover -s tests -p "test_cifar*.py" -v
